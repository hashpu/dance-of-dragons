<!doctype html>
<html lang="en">
<head>
  <script src="js/theme-init.js"></script>
  <script>
    // A direct reload of /houses (not a click-through from the homepage or
    // nav) sends the visitor back to the homepage instead — this page is
    // meant to always be arrived at via "Explore Houses", not landed on
    // cold. location.replace so it doesn't add a bounce-back history entry.
    (function () {
      try {
        var nav = performance.getEntriesByType("navigation")[0];
        if (nav && nav.type === "reload") location.replace("/");
      } catch (e) {}
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Houses · Dungeons &amp; Dragons</title>
  <meta name="description" content="Every Great House of Westeros drawn into the Dance of the Dragons. Click a house to view or build its family tree." />
  <meta name="theme-color" content="#b0b0b5" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Dungeons &amp; Dragons" />
  <meta property="og:title" content="Houses · Dungeons &amp; Dragons" />
  <meta property="og:description" content="Every Great House of Westeros drawn into the Dance of the Dragons. Click a house to view or build its family tree." />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Houses · Dungeons &amp; Dragons" />
  <meta name="twitter:description" content="Every Great House of Westeros drawn into the Dance of the Dragons. Click a house to view or build its family tree." />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar" id="topbar" data-active="/houses"></header>

  <main class="container">
    <div class="crumb">
      <a href="/">← Back to home</a>
    </div>
    <h1 class="page-title">Houses</h1>
    <p class="page-desc">
      Every Great House of Westeros drawn into the Dance of the Dragons. Click a house to view or
      add to its family tree. Some houses have builds available already.
    </p>

    <div class="search-stats-row">
      <div class="input-wrap search-wrap">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="houseSearch" placeholder="Search houses or members..." />
      </div>
      <div class="stats-row" id="statsRow"></div>
    </div>

    <div id="searchResults"></div>
    <div class="house-grid-wrap collapsed" id="houseGridWrap">
      <div class="house-grid" id="houseGrid"></div>
    </div>
    <div class="rally-cta house-explore-cta" id="houseExploreCta">
      <div class="rally-cta-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5L12 4l8 6.5V19a1 1 0 01-1 1h-4v-6H9v6H5a1 1 0 01-1-1z"/></svg>
      </div>
      <div class="rally-cta-text">
        <strong>Every Great House</strong>
        <p id="houseExploreCtaDesc">Click through to browse each house and its family tree.</p>
      </div>
      <button type="button" class="btn btn-primary" id="exploreHousesBtn">Explore Houses</button>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/bg-fx.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/dialog.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/roblox-auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/avatar.js"></script>
  <script src="js/house-card.js"></script>
  <script src="js/reveal.js"></script>
  <script src="js/tilt.js"></script>
  <script src="js/houses.js"></script>
</body>
</html>
