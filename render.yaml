databases:
  - name: dance-of-dragons-db
    plan: free

services:
  - type: web
    name: dance-of-dragons
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dance-of-dragons-db
          property: connectionString
      - key: ADMIN_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20.11.0
